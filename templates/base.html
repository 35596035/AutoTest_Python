<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DAM+ 自動化測試{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <script defer src="{{ url_for('static', filename='dashboard.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <nav class="shell topbar" aria-label="主選單">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">DAM+</span> 自動化測試</a>
      {% block nav %}{% endblock %}
    </nav>
  </header>
  <main class="shell">
    {% block main %}{% endblock %}
  </main>
</body>
</html>
